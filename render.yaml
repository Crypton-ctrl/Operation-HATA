services:
  - type: web
    name: hata-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hata-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set to your deployed frontend URL, e.g. https://hata-frontend.onrender.com
      - key: AI_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false

  - type: web
    name: hata-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # e.g. https://hata-backend.onrender.com/api
      - key: VITE_WS_URL
        sync: false   # e.g. wss://hata-backend.onrender.com/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: hata-db
    plan: free
